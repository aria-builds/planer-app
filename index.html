:root{--pri:#00695c;--onp:#fff;--pc:#b2dfdb;--onpc:#00201c;--bg:#eef3f1;--card:#fff;--nav:#fff;--tx:#191c1b;--mut:#5f6b67;--bd:#d5e0dc;--err:#b3261e;--hol:#c62828;--holbg:#fdecea;--acc:#f9a825;
--e1:0 1px 2px rgba(0,0,0,.2),0 1px 3px 1px rgba(0,0,0,.1);--e2:0 2px 6px 2px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.3);--e3:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.3);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pri:#4db6ac;--onp:#00201c;--pc:#004d40;--onpc:#b2dfdb;--bg:#0f1413;--card:#1a201f;--nav:#1a201f;--tx:#e0e3e1;--mut:#9aa6a2;--bd:#2c3533;--err:#f2b8b5;--hol:#ef9a9a;--holbg:#3b2020}}
:root[data-theme="dark"]{--pri:#4db6ac;--onp:#00201c;--pc:#004d40;--onpc:#b2dfdb;--bg:#0f1413;--card:#1a201f;--nav:#1a201f;--tx:#e0e3e1;--mut:#9aa6a2;--bd:#2c3533;--err:#f2b8b5;--hol:#ef9a9a;--holbg:#3b2020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;font-family:Vazirmatn,Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;transform:scale(0);animation:rp .6s ease-out forwards}
@keyframes rp{from{opacity:.2}to{transform:scale(1);opacity:0}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:4px;background:var(--pri);color:var(--onp);padding:8px 14px;box-shadow:var(--e2)}
.bar h1{flex:1;margin:0;font-size:19px;font-weight:500}
.ib{width:40px;height:40px;border-radius:50%;font-size:18px;display:grid;place-items:center}
.ic{display:inline-flex;vertical-align:middle;flex:none}.ic svg{display:block}
.meta span,.btn,.badge,.ps,.evt{display:inline-flex;align-items:center;gap:5px}
.badge,.evt{flex-wrap:wrap}.ps{margin-inline-start:4px}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 160px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--e1)}
.card.cur{box-shadow:0 0 0 2px var(--pri),var(--e1)}
.fx>*{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.head h2{font-size:17px;margin:0;font-weight:500}
.ctr{text-align:center;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:12px;color:var(--mut);padding:4px 0}
.day{aspect-ratio:1;border-radius:50%;font-size:15px;padding:0}
.day.hol{background:var(--holbg)}
.hol{color:var(--hol)}
.day.today:not(.sel){box-shadow:inset 0 0 0 2px var(--acc)}
.day.sel{background:var(--pri);color:var(--onp);font-weight:700}
.dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--pri)}
.day.sel .dots i{background:var(--onp)}
.occ{position:absolute;top:6px;right:9px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:var(--card)}
.chip.on{background:var(--pc);color:var(--onpc);border-color:transparent}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.task{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px;background:var(--bg);border-radius:12px;border-inline-start:4px solid var(--cc,var(--bd))}
.task input{width:22px;height:22px;accent-color:var(--pri);flex:none}
.tx{flex:1;min-width:0;cursor:pointer}
.tt{word-break:break-word}
.task.done .tt{text-decoration:line-through;color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:3px;font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:10px 0;font-size:14px}
.sub{color:var(--mut);font-size:13px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.dh.wide{width:100%;text-align:start;border-radius:8px;padding:4px}
.badge{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--bg);color:var(--mut)}
.badge.hb{color:var(--hol);background:var(--holbg)}
.lbl{font-weight:500;margin:12px 0 4px}
.card>.lbl:first-child{margin-top:0}
.ev{display:flex;gap:10px;padding:5px 0;font-size:14px}
.ev b{min-width:24px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);line-height:1.9;margin-top:8px}
.prog{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin:4px 0 10px}
.prog i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .3s}
.field{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--tx);font-size:15px}
textarea.field{resize:vertical;line-height:1.9}
.mono{font-family:monospace;font-size:12px;direction:ltr}
.btn{height:40px;padding:0 18px;border-radius:20px;font-weight:500;font-size:14px}
.btn.f{background:var(--pri);color:var(--onp)}
.btn.t{color:var(--pri)}
.btn.e{color:var(--err)}
.acts{display:flex;align-items:center;gap:4px;margin-top:16px}
.fab{position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;width:56px;height:56px;border-radius:16px;background:var(--pc);color:var(--onpc);font-size:30px;box-shadow:var(--e3);display:grid;place-items:center}
.nav{position:fixed;left:0;right:0;max-width:640px;margin:0 auto;bottom:0;z-index:6;display:flex;background:var(--nav);box-shadow:0 -1px 4px rgba(0,0,0,.18);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);overflow:visible}
.pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:17px;transition:background .2s}
.nav .on{color:var(--tx);font-weight:500}
.nav .on .pill{background:var(--pc)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
.sheet h2{margin:0 0 4px;font-size:20px;font-weight:500}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.snack{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:536px;margin:auto;z-index:30;background:#303030;color:#fff;border-radius:8px;padding:6px 16px;min-height:48px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--e3);animation:in .2s}
.snack .btn{color:#80cbc4}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-size:30px;font-weight:700;color:var(--pri);display:flex;align-items:center;gap:8px}
.cols{display:flex;align-items:flex-end;gap:8px;height:130px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--mut)}
.col i{display:block;width:100%;max-width:28px;border-radius:6px 6px 0 0;background:var(--pri)}
.res{display:block;width:100%;text-align:start;padding:10px;border-radius:12px;margin-bottom:6px;background:var(--bg)}
.qrow{display:flex;gap:6px;margin-bottom:10px}.qrow .field{padding:9px 12px}.qrow .ib{background:var(--pri);color:var(--onp);flex:none}
.chips .field{width:auto;flex:1;min-width:72px}
.promo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--tx);border:1px solid var(--pc)}
.ic-b{width:40px;height:40px;border-radius:12px;background:var(--pc);color:var(--onpc);display:grid;place-items:center;flex:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}
@media(min-width:900px){
.wrap{max-width:1040px;padding-inline:20px}
.bar{padding-inline:max(14px,calc(50% - 506px))}
.fab{left:max(16px,calc(50% - 504px))}
.scrim{align-items:center}.sheet{border-radius:28px;max-height:86%}
.mv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;align-items:start}
.mv>:first-child{grid-column:1;grid-row:1/span 5}.mv>:nth-child(n+2){grid-column:2}
.wv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.wv>*{margin-bottom:0}.wv>:nth-child(-n+3){grid-column:1/-1}
.dv{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0 16px;align-items:start}
.dv>.head,.dv>.chips{grid-column:1/-1}
.sv{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.sv>*{margin-bottom:0}.sv>.stats,.sv>:nth-child(4){grid-column:1/-1}
.nv{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.nv>*{margin-bottom:0}.nv>:first-child,.nv>.empty,.nv>.occ-card,.nv>.promo{grid-column:1/-1}
.nar{max-width:640px;margin-inline:auto}
}

const TABS=[['month','ماهانه','month'],['week','هفتگی','week'],['day','روزانه','day'],['stats','آمار','stats'],['notes','یادداشت‌ها','notes']];
function render(){const app=$('app');app.innerHTML='';app.append(V[view]());const nv=$('nav');nv.innerHTML='';
  TABS.forEach(([id,t,i])=>nv.append(h('button',{class:'rip'+(id===view?' on':''),onclick:()=>go(id)},h('span',{class:'pill'},ic(i,22)),t)));
  $('fab').style.display=['month','week','day'].includes(view)?'grid':'none'}
function go(v){view=v;render();const a=$('app');a.classList.remove('fx');void a.offsetWidth;a.classList.add('fx');window.scrollTo(0,0)}
$('bs').append(ic('search'));$('bb').append(ic('save'));$('fab').append(ic('add',28));
$('fab').onclick=()=>taskSheet(null);$('bs').onclick=()=>go('search');$('bb').onclick=backup;
render();
initNotif().then(()=>{if(notifOn)rescheduleAll()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
