name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - name: Use the app icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              [ -f android/app/src/main/res/mipmap-$d/$f.png ] && cp icon-512.png android/app/src/main/res/mipmap-$d/$f.png || true
            done
          done

      # --- Release signing ---
      # Requires three repo secrets (Settings -> Secrets and variables -> Actions):
      #   ANDROID_KEYSTORE_BASE64   (the .keystore file, base64-encoded)
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Add release signing config
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          python3 - << 'EOF'
          import re
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          sign = '''
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv("KS_PASSWORD")
                      keyAlias System.getenv("KS_ALIAS")
                      keyPassword System.getenv("KS_PASSWORD")
                  }
              }
          '''
          s = re.sub(r"(android\s*\{)", r"\1" + sign, s, count=1)
          s = s.replace(
              "buildTypes {",
              "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }",
              1,
          )
          open(p, "w", encoding="utf-8").write(s)
          EOF

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: cd android && ./gradlew assembleRelease

      - name: Upload release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk

      # --- Fallback: unsigned debug build, only runs if no keystore secret is set ---
      - name: Build debug APK (no keystore configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
